<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics — Smart Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">🌿</div>
            <div class="logo-text"><strong>Smart Kitchen</strong><span>Food Waste Logger</span></div>
        </div>
        <nav>
            <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
            <a href="add-record.html" class="nav-link">➕ Log Waste</a>
            <a href="records.html" class="nav-link">📋 Records</a>
            <a href="analytics.html" class="nav-link active">📊 Analytics</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="user-box">
                <div class="user-avatar">👤</div>
                <div><div class="user-name" id="userName">Loading...</div><div class="user-role" id="userRole"></div></div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Kitchen Analytics</h1>
            <p>Data-driven insights to help you reduce food waste.</p>
        </div>

        <div class="charts-grid">
            <div class="card">
                <div class="card-title">Waste by Food Item</div>
                <div class="card-sub">Total kg wasted per item</div>
                <canvas id="itemChart"></canvas>
            </div>
            <div class="card">
                <div class="card-title">Waste by Day</div>
                <div class="card-sub">Total waste on each day of week</div>
                <canvas id="dayChart"></canvas>
            </div>
        </div>

        <h2 style="font-size:20px; font-weight:800; margin-bottom:16px">💡 Smart Suggestions</h2>
        <div class="suggestions-grid" id="suggestions"></div>
    </main>

    <script src="js/main.js"></script>
    
</body>
</html>
