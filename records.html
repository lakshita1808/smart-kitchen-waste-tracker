<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records — Smart Kitchen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="layout">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="logo-icon">🌿</div>
            <div class="logo-text"><strong>Smart Kitchen</strong><span>Food Waste Logger</span></div>
        </div>
        <nav>
            <a href="dashboard.html" class="nav-link">🏠 Dashboard</a>
            <a href="add-record.html" class="nav-link">➕ Log Waste</a>
            <a href="records.html" class="nav-link active">📋 Records</a>
            <a href="analytics.html" class="nav-link" id="analyticsLink" style="display:none">📊 Analytics</a>
        </nav>
        <div class="sidebar-bottom">
            <div class="user-box">
                <div class="user-avatar">👤</div>
                <div><div class="user-name" id="userName">Loading...</div><div class="user-role" id="userRole"></div></div>
            </div>
            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h1>Waste Records</h1>
            <p>View and manage all food waste entries.</p>
        </div>

        <div class="table-wrap">
            <div class="table-top">
                <input type="text" class="search-box" id="searchBox" placeholder="🔍 Search food items...">
                <a href="add-record.html" class="btn btn-primary">➕ Add New</a>
            </div>
            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Day</th>
                            <th>Food Item</th>
                            <th>Quantity</th>
                            <th id="addedByHead" style="display:none">Added By</th>
                            <th id="actionsHead" style="display:none">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="recordsTable">
                        <tr><td colspan="6" style="text-align:center; padding:30px; color:#94a3b8">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    
</body>
</html>
